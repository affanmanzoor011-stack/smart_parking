services:
  - type: web
    name: smart-parking-violation
    runtime: python
    plan: free
    # rapidocr is installed with --no-deps so it does not pull the non-headless
    # opencv-python (which breaks on Render because libGL is missing).
    buildCommand: pip install -r requirements-render.txt && pip install --no-deps rapidocr-onnxruntime
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false --server.fileWatcherType none --browser.gatherUsageStats false --server.maxUploadSize 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # memory savers (free plan has only 512 MB)
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      # If Render ever says "out of memory", set this to "1" (plate-only mode)
      - key: SKIP_VEHICLE_DETECTION
        value: "0"
      # secrets: enter the values in the Render dashboard (never in this file)
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_PASSWORD
        sync: false
